<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Registro de productor - Lojanova</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/admin/css/admin.css?v=20260803-admin-polish">
</head>
<body>

<div class="login-screen">
  <div class="login-card auth-card-wide">
    <div class="logo">Loja<span>nova</span></div>
    <p class="sub">Registro de productores</p>

    <div class="error-msg" id="errorMsg" style="display:none"></div>
    <div class="success-msg" id="successMsg" style="display:none"></div>

    <form id="authForm" data-mode="registro">
      <div class="field">
        <label>Nombre completo</label>
        <input type="text" id="nombre" required>
      </div>

      <div class="field">
        <label>Nombre del emprendimiento</label>
        <input type="text" id="emprendimiento" required>
      </div>

      <div class="field">
        <label>Correo</label>
        <input type="email" id="email" required>
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6">
      </div>

      <div class="field">
        <label>Confirmar contraseña</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Crear cuenta</button>
    </form>

    <p style="text-align:center;margin-top:20px">
      <a href="/index.html">Volver al sitio público</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js?v=20260823-auditoria"></script>
<script src="/js/supabase-client.js?v=20260823-auditoria"></script>
<script src="/js/productor-auth.js?v=20260823-auditoria"></script>

</body>
</html>
