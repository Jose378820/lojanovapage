<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso productor - Lojanova</title>
<link rel="stylesheet" href="admin/css/admin.css">
<link rel="stylesheet" href="css/producer-panel.css">
<link rel="manifest" href="/manifest.webmanifest?v=20260803-force-floating">
<meta name="theme-color" content="#1E5A3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lojanova">
<link rel="apple-touch-icon" href="/assets/lojanova-app-icon.svg">
</head>
<body>
<button class="mobile-app-download notranslate" id="mobileAppDownload" type="button" aria-label="Descargar Lojanova como app">
  <span aria-hidden="true">↓</span>
  <strong>App</strong>
</button>

<div class="login-screen">
  <div class="login-card">
    <div class="logo">Loja<span>nova</span></div>
    <p class="sub">Portal del productor</p>

    <div class="error-msg" id="errorMsg" style="display:none"></div>

    <form id="authForm">
      <div class="field">
        <label>Correo</label>
        <input type="email" id="email" required autocomplete="username">
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Ingresar</button>
    </form>

    <p style="text-align:center;margin-top:22px;font-size:.82rem">
      <a href="recuperar-password.html" style="color:var(--verde-bosque);font-weight:700">Olvidé mi contraseña</a>
    </p>

    <p style="text-align:center;margin-top:14px;font-size:.82rem">
      ¿No tienes cuenta?
      <a href="registro.html" style="color:var(--verde-bosque);font-weight:700">Regístrate</a>
    </p>

    <p style="text-align:center;margin-top:10px;font-size:.82rem">
      <a href="index.html" style="color:var(--verde-bosque)">Volver al sitio público</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/productor-auth.js"></script>

<script src="/js/pwa-install.js?v=20260803-force-floating"></script>
</body>
</html>
