<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña - Lojanova</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/admin/css/admin.css?v=20260730-password-reset">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="logo">Loja<span>nova</span></div>
    <p class="sub">Crea una nueva contraseña</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="updatePasswordForm">
      <div class="field">
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6">
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Actualizar contraseña</button>
    </form>

    <p style="text-align:center;margin-top:22px;font-size:.82rem">
      <a href="login.html" style="color:var(--verde-bosque);font-weight:700">Volver al inicio de sesión</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js?v=20260730-password-reset"></script>
<script src="/js/supabase-client.js?v=20260730-password-reset"></script>
<script src="/js/password-reset.js?v=20260730-password-reset"></script>
</body>
</html>
