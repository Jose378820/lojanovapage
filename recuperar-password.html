<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña - Lojanova</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/admin/css/admin.css?v=20260803-stats-fix">
<link rel="manifest" href="/manifest.webmanifest?v=20260803-force-floating">
<meta name="theme-color" content="#1E5A3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lojanova">
<link rel="apple-touch-icon" href="/assets/lojanova-app-icon.svg">
</head>
<body>
<button class="mobile-app-download notranslate" id="mobileAppDownload" type="button" aria-label="Descargar Lojanova como app">
  <span aria-hidden="true">↓</span>
  <strong>App</strong>
</button>

<div class="login-screen">
  <div class="login-card">
    <div class="logo">Loja<span>nova</span></div>
    <p class="sub">Recupera tu acceso de productor</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="recoverForm">
      <div class="field">
        <label for="email">Correo registrado</label>
        <input type="email" id="email" required autocomplete="username" placeholder="tucorreo@gmail.com">
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Enviar enlace</button>
    </form>

    <p style="text-align:center;margin-top:22px;font-size:.82rem">
      <a href="login.html" style="color:var(--verde-bosque);font-weight:700">Volver al inicio de sesión</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js?v=20260803-stats-fix"></script>
<script src="/js/supabase-client.js?v=20260803-stats-fix"></script>
<script src="/js/password-reset.js?v=20260803-stats-fix"></script>
<script src="/js/pwa-install.js?v=20260803-force-floating"></script>
</body>
</html>
